{% extends "chat/base.html" %}
{% block title %}Sign in — Aura{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">✦ Aura</div>
    <h1>Welcome back</h1>
    {% if form.errors %}
      <ul class="errorlist"><li>Incorrect username or password.</li></ul>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign in</button>
    </form>
    <p>No account? <a href="{% url 'signup' %}">Sign up free</a></p>
  </div>
</div>
{% endblock %}
